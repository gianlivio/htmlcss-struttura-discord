<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Una semplice struttura della homepage di Discord.">
    <title>Discord Homepage</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <!-- header -->
    <header>
        <div class="container displayflex">
            <div class="logo">LOGO</div>
            <nav class="menu">
                <ul>
                    <li><a href="#">Link 1</a></li>
                    <li><a href="#">Link 2</a></li>
                    <li><a href="#">Link 3</a></li>
                    <li><a href="#">Link 4</a></li>
                </ul>
            </nav>
            <div class="button">
                <a href="#">Login</a>
            </div>
        </div>
    </header>
    <!-- /header -->

    <!-- main -->
    <main>
        <!-- hero / jumbotron -->
        <div class="container2">
            <div class="hero">
                <!-- Contenuto eroe -->
            </div>
        </div>

        <!-- central part 4 sections -->
        <!-- section1 -->
        <div class="container3">
            <div class="rett1"></div>
            <div class="rett2"></div>
        </div>

        <!-- section2 -->
        <div class="container4">
            <div class="rett3"></div>
            <div class="rett4"></div>
        </div>

        <!-- section3 -->
        <div class="container3">
            <div class="rett1"></div>
            <div class="rett2"></div>
        </div>

        <!-- section4 -->
        <div class="container5">
            <div class="rettverde"></div>
        </div>
    </main>
    <!-- /main -->

    <!-- footer -->
    <footer>
        <!-- footer1 -->
        <div class="footer1">
            <div class="footerbanner2"></div>
            <div class="footerbanner">
                <ul>
                    <li><a href="#">Footer Link 1</a></li>
                    <li><a href="#">Footer Link 2</a></li>
                    <li><a href="#">Footer Link 3</a></li>
                    <li><a href="#">Footer Link 4</a></li>
                </ul>
            </div>
        </div>

        <!-- footer2 -->
        <div class="footer2">
            <div class="footercontainer">
                <div class="footerlogo">Logo</div>
                <div class="footerbottone"><button>Bottone</button></div>
            </div>
        </div>
    </footer>
    <!-- /footer -->
</body>

</html>
